[project]
name = "pypub"
version = "0.1.0"
description = "Leitor de EPUB em Qt6 — PySide6 + Kirigami + WebEngine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.12",
    "pyside6-webengine>=6.12",
]

[project.scripts]
pypub = "pypub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pypub"]
